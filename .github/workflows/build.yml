name: Build plugin

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-linux-amd64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Install Rust 1.99.1
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1

      - name: Build plugin
        run: cargo build --release

      - name: Checkout Codex Proxy RS packaging tool
        run: git clone --depth 1 --branch v3.29.7 https://github.com/zyycn/codex-proxy-rs.git /tmp/codex-proxy-rs

      - name: Package plugin
        run: |
          cargo run --manifest-path /tmp/codex-proxy-rs/backend/Cargo.toml \
            -p codex-proxy-plugin-cli --locked -- \
            package \
            --manifest "$GITHUB_WORKSPACE/plugin.json" \
            --binary "$GITHUB_WORKSPACE/target/release/codex-proxy-wxpusher-monitor" \
            --target x86_64-unknown-linux-gnu \
            --output-dir "$GITHUB_WORKSPACE/dist"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: wxpusher-account-monitor-linux-amd64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

