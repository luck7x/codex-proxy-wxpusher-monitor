[package]
name = "codex-proxy-wxpusher-monitor"
version = "0.1.1"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.99.1"

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", tag = "v3.29.7", features = ["io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", default-features = false, features = ["io-std", "macros", "rt"] }

[profile.release]
debug = false
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"

